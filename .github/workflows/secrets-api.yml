name: Secrets API

# Deliberately a separate workflow from ci.yml rather than another job inside
# it. ADR-003 D1 names CI path filters as "most of the day-to-day clutter cost",
# and the console pipeline has no reason to run when only Go changed — nor this
# one when only TypeScript did.

on:
  push:
    branches: [main]
    paths:
      - 'secrets-api/**'
      - 'platform-auth/**'
      - 'go.work'
      - 'Dockerfile.secrets-api'
      - '.github/workflows/secrets-api.yml'
      # platform-auth/capabilities_contract_test.go READS this TypeScript file
      # across the module boundary, so a TS-only change can break a Go test.
      # Without this path, that break lands on main with nothing to catch it —
      # exactly what happened in #408.
      - 'packages/platform-auth/**'
  pull_request:
    branches: [main]
    paths:
      - 'secrets-api/**'
      - 'platform-auth/**'
      - 'go.work'
      - 'Dockerfile.secrets-api'
      - '.github/workflows/secrets-api.yml'
      # platform-auth/capabilities_contract_test.go READS this TypeScript file
      # across the module boundary, so a TS-only change can break a Go test.
      # Without this path, that break lands on main with nothing to catch it —
      # exactly what happened in #408.
      - 'packages/platform-auth/**'
  workflow_dispatch:

concurrency:
  group: secrets-api-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tesserix-secrets-api

permissions:
  contents: read
  packages: write

jobs:
  # platform-auth is a module dependency of secrets-api (wired via the go.work
  # replace directive), not a package inside it — `go test ./...` run from
  # secrets-api never crosses that module boundary. Moving the Zitadel verifier
  # and capability vocabulary into their own module took them out of every CI
  # job in the repository, including capabilities_contract_test.go, the exact
  # Go<->TypeScript regression guard #408 exists to catch. This job restores
  # coverage, following the same four checks the other modules get.
  platform-auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-auth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: platform-auth/go.sum

      - name: Verify formatting
        # gofmt exits 0 whether or not it found anything, so the output is the
        # signal. Without this check the -l listing scrolls past in a green run.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        # A go.mod that drifts from the imports makes every later dependency
        # change produce an unrelated diff, and hides an accidental dependency
        # in the noise.
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' in platform-auth/"
            diff go.mod.bak go.mod || true
            exit 1
          fi
          rm go.mod.bak go.sum.bak

      - name: Vet
        run: go vet ./...

      # Reachability-based vulnerability scan, added because NOTHING in this
      # repo checked Go dependencies. The pnpm audit gate in ci.yml cannot see
      # a go.mod by construction, and Dependabot — which does read them —
      # reports advisories without asking whether our code calls the vulnerable
      # symbol. On 2026-09-10 it was flagging two high gRPC advisories here
      # (GHSA-2v4p-qf9q-27wj, GHSA-vp52-pcj8-j9qc); govulncheck against the
      # toolchain that actually ships reports them as NOT reachable, and
      # exits 0.
      #
      # THAT EXIT BEHAVIOUR IS THE WHOLE DESIGN. govulncheck fails only when a
      # vulnerable symbol is genuinely called, so this step is green on arrival
      # and means something the day it goes red. A gate that is red from the
      # first commit is one people learn to skip — the same reason ci.yml's
      # audit step uses --audit-level=high rather than moderate.
      #
      # It also covers what Dependabot does NOT: the Go STANDARD LIBRARY. That
      # matters more than it sounds. `go 1.26.5` in go.mod is a minimum, not a
      # pin, and the Dockerfiles build `FROM golang:1.26-alpine` — a floating
      # tag, currently 1.26.8. Scanning with a local 1.26.5 toolchain reports
      # seven reachable stdlib findings that do not exist in the shipped
      # binary; scanning here uses the same `go-version: '1.26'` the build
      # does, so the answer describes what is deployed rather than what is
      # installed on someone's laptop.
      - name: Vulnerability scan (reachable only)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)"/bin/govulncheck ./...

      - name: Test
        run: go test -race -count=1 ./...

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secrets-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: secrets-api/go.sum

      - name: Verify formatting
        # gofmt exits 0 whether or not it found anything, so the output is the
        # signal. Without this check the -l listing scrolls past in a green run.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        # A go.mod that drifts from the imports makes every later dependency
        # change produce an unrelated diff, and hides an accidental dependency
        # in the noise.
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' in secrets-api/"
            diff go.mod.bak go.mod || true
            exit 1
          fi
          rm go.mod.bak go.sum.bak

      - name: Vet
        run: go vet ./...

      # Same reachability scan as the job above — see its comment for why this
      # exits 0 on unreachable findings and why it covers the stdlib.
      - name: Vulnerability scan (reachable only)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)"/bin/govulncheck ./...

      - name: Test
        run: go test -race -count=1 ./...

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Built on pull requests too, without pushing.
      #
      # ci.yml documents why this matters: for eight consecutive merges every PR
      # went green while every main build failed on the same Dockerfile error,
      # because nothing compiled a Dockerfile until after the merge. A local tag
      # publishes nothing and cannot trigger a Kargo promotion.
      - name: Build image (PR check, no push)
        if: github.event_name == 'pull_request'
        run: docker build --platform linux/amd64 -f Dockerfile.secrets-api -t secrets-api:pr-check .

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push only from main, for the reason ci.yml gives: a main-<sha> image is
      # auto-promoted to prod by Kargo, so pushing from any other branch is an
      # unintended deploy.
      - name: Build and push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.secrets-api \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push --all-tags ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}

      - name: Security scan
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-secrets-api.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload scan results
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # Code scanning needs GitHub Advanced Security, which is off while this
        # repo is private — best-effort, exactly as ci.yml does.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-secrets-api.sarif
          category: secrets-api
