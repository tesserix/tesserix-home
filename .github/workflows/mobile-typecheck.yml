name: Mobile Admin - Typecheck

on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'bugfix/**', 'hotfix/**']
    paths:
      - 'apps/mobile/**'
      - 'packages/homechef-shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-typecheck.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/homechef-shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-typecheck.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: tsc (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
      - name: Install locked dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @tesserix/homechef-shared build
      - name: Typecheck
        working-directory: apps/mobile
        run: pnpm exec tsc --noEmit
