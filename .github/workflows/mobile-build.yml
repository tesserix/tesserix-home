name: Mobile Admin - EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production, development]
        default: preview
      submit:
        description: Submit the completed build to the configured store
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-eas-${{ inputs.platform }}-${{ inputs.profile }}-${{ inputs.submit }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS build (mobile)
    uses: tesserix/tesserix-workflows/.github/workflows/expo-eas-build.yml@v2.1.0
    with:
      working_directory: apps/mobile
      install_directory: .
      lockfile_path: pnpm-lock.yaml
      node_version: "22"
      package_manager: pnpm
      pnpm_version: 10.17.1
      workspace_filter: mobile
      platform: ${{ inputs.platform }}
      profile: ${{ inputs.profile }}
      no_wait: true
      auto_submit: ${{ inputs.submit }}
    secrets:
      expo_token: ${{ secrets.EXPO_TOKEN }}
      package_read_token: ${{ secrets.PKG_READ_TOKEN }}
