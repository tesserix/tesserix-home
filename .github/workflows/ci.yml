name: CI

on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'bugfix/**', 'hotfix/**']
    paths:
      - 'apps/web/**'
      - 'apps/console/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.npmrc'
      - 'Dockerfile'
      - 'Dockerfile.console'
      - '.dockerignore'
      - 'package.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    # Mirrors the push filter above. Without it every PR ran the full Node
    # pipeline — including PRs that touch only platform-api/ or only docs —
    # which is the clutter cost ADR-003 D1 names. Safe to filter because main
    # carries no required status checks (verified 2026-08-18), so a PR that
    # matches no path is not left waiting on a check that never starts.
    paths:
      - 'apps/web/**'
      - 'apps/console/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.npmrc'
      - 'Dockerfile'
      - 'Dockerfile.console'
      - '.dockerignore'
      - 'package.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_NAME: tesserix-home
  CONSOLE_IMAGE_NAME: tesserix-console
  # Kargo's `services` Warehouse does not watch GHCR. It watches an Artifact
  # Registry *remote (pull-through) repository* that mirrors GHCR — see the
  # warm step at the end of build-and-push for why that matters. Not secret;
  # same values as the sibling tesserix-k8s workflows hardcode.
  GCP_PROJECT_ID: tesseracthub-480811
  MIRROR_HOST: asia-south1-docker.pkg.dev
  MIRROR_REPO: tesseracthub-480811/ghcr-remote/tesserix
  WIF_PROVIDER: projects/849928263410/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SA_EMAIL: github-actions@tesseracthub-480811.iam.gserviceaccount.com

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read # upload-sarif@v3 reads the run's metadata (else it 403s on push)
      id-token: write # WIF for the GAR mirror warm step at the end of this job
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}

      # apps/web and apps/console import @tesserix/platform-auth and
      # @tesserix/console-core, whose package.json entries point at dist/. A fresh
      # CI clone has no dist/, so Vitest fails with "Failed to resolve entry for
      # package". turbo.json already declares test:unit/typecheck dependsOn ^build,
      # but the steps below invoke pnpm directly and bypass turbo — so build the
      # workspace packages explicitly, as mobile-typecheck.yml does.
      - name: Build workspace packages
        run: pnpm --filter './packages/*' build

      # These steps invoke pnpm directly rather than `turbo run lint`, so a lint
      # script added to a workspace package is not picked up unless it is named
      # here. Without this step packages/* stays unlinted in CI even though the
      # scripts now exist (#202).
      - name: Lint (workspace packages)
        run: pnpm --filter './packages/*' lint

      # The same gap once more, for typecheck (#231). turbo.json declares a
      # typecheck task, but nothing in this file runs turbo, so a package's
      # `typecheck` script executes only if a step names it — and `pnpm
      # --filter` skips a package that has no such script silently, exit 0.
      # packages/tsconfig (JSON only) and packages/eslint-config (.mjs only)
      # hold no TypeScript and are deliberately script-less; every other
      # workspace package must declare the script, which
      # apps/console/lib/workspace-typecheck.guard.test.ts enforces so the next
      # one added is not skipped in silence the way crm-country was.
      - name: Typecheck (workspace packages)
        run: pnpm --filter './packages/*' typecheck

      # Same gap as the lint step above, for tests (#206). packages/* holds the
      # route table, the per-route capability declarations, the estate registry
      # and the audit repo — the files every renderer in the estate reads — and
      # until this step existed their tests ran only on developer machines.
      #
      # #200 is the case that shows why it matters: three shipped palette tests
      # went red the moment the capability filter started biting, and that
      # redness was the evidence the fix worked. On a developer's machine that
      # signal is one `pnpm test` away from being lost.
      - name: Unit tests (workspace packages)
        run: pnpm --filter './packages/*' test:unit

      - name: Lint (web)
        run: pnpm --filter web lint

      # Enumerated per target for the same reason as the packages step above
      # (#231): direct pnpm, not turbo, so the app is type-checked in CI only
      # because this step names it.
      - name: Typecheck (web)
        run: pnpm --filter web typecheck

      - name: Unit tests (web)
        run: pnpm --filter web test:unit

      - name: Lint (console)
        run: pnpm --filter console lint

      # Same as the web typecheck step above (#231). apps/mobile is absent on
      # purpose: it has its own mobile-typecheck.yml, and apps/mobile/** is not
      # in this workflow's paths: filter.
      - name: Typecheck (console)
        run: pnpm --filter console typecheck

      - name: Unit tests (console)
        run: pnpm --filter console test:unit

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=main-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      # Build BOTH images on pull requests, without pushing.
      #
      # The push-only-on-main rule below is right and stays. But "do not push"
      # was implemented as "do not build", and those are different things: for
      # eight consecutive merges (#200 through #212) every PR went green while
      # every main build failed on the same Dockerfile error, because nothing
      # compiled a Dockerfile until after the merge. Building without tagging a
      # registry or calling `docker push` publishes nothing and cannot trigger a
      # Kargo promotion, so the deploy-safety reason for skipping it does not
      # apply.
      #
      # Local tags only. No registry reference, no push, no scan.
      - name: Build images (PR check, no push)
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            --secret id=NODE_AUTH_TOKEN,env=NODE_AUTH_TOKEN \
            --platform linux/amd64 \
            -t tesserix-home:pr-check \
            .
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.console \
            -t tesserix-console:pr-check \
            .

      # Image build/push (and the scan steps below) run ONLY on pushes to main.
      # A push to any other branch (feat/**, etc.) would otherwise publish a
      # main-<sha> image that Kargo auto-promotes straight to prod — an
      # unintended deploy. PRs validate lint/test without building an image.
      - name: Build and push
        if: github.ref == 'refs/heads/main'
        run: |
          docker build \
            --secret id=NODE_AUTH_TOKEN,env=NODE_AUTH_TOKEN \
            --platform linux/amd64 \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push --all-tags ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}

      # No GKE deploy step here. Cluster rollout is owned by Kargo:
      # the kargo-tesserix-home Project's prod Stage discovers the new
      # main-<sha> image (via the GAR ghcr-remote mirror), auto-promotes
      # it, and rewrites the `company` Argo CD Application's `image.tag`
      # Helm parameter — Argo CD then syncs the Deployment. See
      # tesserix-k8s: kargo-manifests/projects/tesserix-home and
      # argocd/prod/apps/global/company.yaml.

      - name: Security scan
        if: github.ref == 'refs/heads/main'
        # Pinned off @master — @master regressed (cache-path failure). v0.36.0
        # pins setup-trivy/actions-cache to known-good versions.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload scan results
        if: github.ref == 'refs/heads/main'
        # Code scanning needs GitHub Advanced Security, which is off while this repo is
        # private; keep the SARIF upload best-effort so it succeeds when public/GHAS and
        # never fails CI when it can't upload. The Trivy scan itself still runs above.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: web

      # Console image build/push, mirroring the web build above exactly (same
      # tags, same --platform, same main-only condition). No --secret mount:
      # per .npmrc, @tesserix/* packages are on the public npm registry now,
      # so Dockerfile.console has nothing to authenticate.
      #
      # Deliberately ordered AFTER the web scan and its SARIF upload: steps in a
      # job are sequential and fail-fast, so a console build failure here must
      # not abort the job between the web image being pushed and the web image
      # being scanned. Web ships scanned regardless of the console build.
      - name: Build and push (console)
        if: github.ref == 'refs/heads/main'
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.console \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CONSOLE_IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CONSOLE_IMAGE_NAME }}:latest \
            .
          docker push --all-tags ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CONSOLE_IMAGE_NAME }}

      # Console image gets the same scan treatment as web — it carries an
      # authenticated admin surface, so it should not ship unscanned while
      # its sibling image is scanned. Distinct output filename and SARIF
      # category so this upload sits alongside the web scan's results
      # instead of clobbering them.
      - name: Security scan (console)
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CONSOLE_IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-console-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload scan results (console)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-console-results.sarif
          category: console

      # --- Warm the GAR pull-through mirror (#494) ---
      #
      # Both images are now in GHCR, but Kargo's `services` Warehouse does not
      # subscribe to GHCR. It subscribes to
      # asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/...,
      # an Artifact Registry *remote (pull-through) repository*. A pull-through
      # cache fetches a tag only when something asks for it, and until the first
      # ArgoCD/node pull nothing does — so the Warehouse keeps listing the
      # previous tag as newest ("Freight composed of the newest artifacts
      # already exists") and every deploy stalled 20-30 minutes.
      #
      # One authenticated registry-v2 manifest GET per image pulls the tag
      # through; the Warehouse's next 5-minute poll then discovers it. Verified
      # by hand on main-86011e1: absent from `gcloud artifacts docker tags list`
      # before the GET, 200 from the GET, present immediately after.
      #
      # `gcloud artifacts docker images describe` is NOT a substitute — it
      # answers "Image not found" without triggering a fetch. Only a real
      # manifest request populates the cache, and only with the OCI/Docker
      # manifest+index media types in Accept.
      - name: Authenticate to Google Cloud (WIF)
        id: gcp-auth
        if: github.ref == 'refs/heads/main'
        # Never fail the build: the images are pushed and correct by this point,
        # the warm is only a latency optimisation. A failure here still shows as
        # a red step in the run, and the warm step below reports the resulting
        # HTTP status per image.
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          token_format: access_token

      - name: Warm GAR mirror for pushed tags
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          # Every image this job pushes. Keep in step with the two `Build and
          # push` steps above — an image added there and not here goes back to
          # stalling Kargo, silently.
          IMAGES: ${{ env.IMAGE_NAME }} ${{ env.CONSOLE_IMAGE_NAME }}
          TAG: ${{ steps.meta.outputs.tag }}
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          set -uo pipefail
          # Only the immutable main-<sha7> tag is warmed. `latest` moves and is
          # not what the Warehouse discovers on.
          failed=0
          for image in $IMAGES; do
            url="https://${MIRROR_HOST}/v2/${MIRROR_REPO}/${image}/manifests/${TAG}"
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 60 \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
              "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "warmed ${image}:${TAG} -> HTTP ${code}"
            else
              # A warning annotation, not a failure: visible in the run summary
              # so a 401/403 (WIF or IAM regression) or 404 (tag genuinely not
              # in GHCR) is noticed rather than absorbed, without failing a
              # build whose images already shipped.
              echo "::warning title=GAR mirror warm failed::${image}:${TAG} -> HTTP ${code} (${url}); Kargo may take 20-30min to discover this tag. See issue #494."
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "${failed} image(s) not warmed; deploy latency only, images are pushed."
          fi
          exit 0

  console-e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    # A real Postgres for the console to read (#271).
    #
    # Before this, the suite ran with TESSERIX_DB_* unset, so EVERY CRM surface
    # rendered its error state by design. It passed 17/17 and proved only that
    # the console fails gracefully — which is why #245, a live drift-clock bug,
    # had to be caught by pglite integration tests instead.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tesserix_admin
          POSTGRES_USER: tesserix
          # trust, so there is no password literal in this file at all. A
          # workflow file is exactly where a real key could land, so it stays
          # under secret scanning — see .gitguardian.yaml. The container is
          # reachable only from inside this job and lives for its duration.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TESSERIX_DB_HOST: localhost
      # 5432 here, not the 55432 docker-compose.dev.yml uses locally — the
      # service container has the port to itself, and the local offset exists
      # only to avoid colliding with a developer's own Postgres.
      TESSERIX_DB_PORT: '5432'
      TESSERIX_DB_NAME: tesserix_admin
      TESSERIX_DB_USER: tesserix
      # Irrelevant under trust auth, and said out loud rather than hidden: the
      # server accepts any password. A value is still needed because the
      # console's isDatabaseConfigured() and db-migrate both require one, and
      # weakening those production guards to suit CI would be the wrong trade.
      TESSERIX_DB_PASSWORD: ${{ github.run_id }}
      # The service container speaks no TLS; the cluster requires it.
      TESSERIX_DB_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}

      # Console imports @tesserix/platform-auth and @tesserix/console-core,
      # whose package.json entries point at dist/. Build them first, as
      # build-and-push does above.
      - name: Build workspace packages
        run: pnpm --filter './packages/*' build

      # Same migrations as production, then the same seed a developer runs.
      # Deriving the schema from the migrations rather than a fixture is what
      # keeps this from drifting: a migration that breaks the console breaks
      # this job.
      - name: Migrate the test database
        run: node apps/web/scripts/db-migrate.mjs

      - name: Seed the test database
        run: node apps/console/scripts/seed-dev.mjs

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      # Playwright starts BOTH servers itself (playwright.config.ts): the
      # admin-API stub on 3002 and the console on 3003. No step is needed here
      # to launch them, and adding one would fight with reuseExistingServer.
      - name: Console browser tests
        run: pnpm --filter console e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-playwright-report
          path: apps/console/playwright-report/
          retention-days: 7
